
name: Construire Nova Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dependances
        run: npm install --no-audit --no-fund

      - name: Construire Nova Store
        run: npm run build

      - name: Verifier le client Supabase
        run: test -s www/supabase.min.js

      - name: Ajouter Android
        run: npx cap add android

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Construire APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Renommer APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NovaStore.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaStore-APK
          path: NovaStore.apk
          
